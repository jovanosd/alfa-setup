<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alfa-setup</title>
    <link rel="stylesheet" href="styel/styel.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-poppins">
  <main class=" min-h-screen bg-[#010313] bg-[url(images/background.png)] bg-no-repeat bg-center">

    <section id="home-screen" class="home min-h-screen text-green-500 flex  justify-center   items-center  ">
       <div class="flex flex-col items-center gap-5 ">
        <h1 class="text-8xl font-poppins  ">Alfa class pro</h1>
        <p class="uppercase">unleash your keyboard kung fu: press"enter"to play  </p>
        <button onclick="play()" class="btn">play now</button> 
       </div> 
    </section>
    <section id="play-ground" class="hidden">
      <div class="flex flex-col items-center gap-5  ">
      
        <div class="artboard artboard-horizontal phone-6 border-[20px] rounded-2xl border-[#010313CC] bg-[#ffffffB3]">
          <div class="flex justify-center ">
            <p class="bg-[#2F2941] px-6 text-white pb-4 rounded-xl">dont watch keyaborad while playing...</p>
          </div>
            <div class="flex justify-center items-center h-full">
              <p id="inner-tex" class="text-black text-8xl font-bold uppercase">Y</p>
            </div>
        </div>
      
        <div>
          <div class="my-1 flex w-full justify-center gap-1">
  <kbd id="q" class="kbd">q</kbd>
  <kbd id="w" class="kbd">w</kbd>
  <kbd id="e" class="kbd">e</kbd>
  <kbd id="r" class="kbd">r</kbd>
  <kbd id="t" class="kbd">t</kbd>
  <kbd id="y" class="kbd">y</kbd>
  <kbd id="u" class="kbd">u</kbd>
  <kbd id="i" class="kbd">i</kbd>
  <kbd id="o" class="kbd">o</kbd>
  <kbd id="p" class="kbd">p</kbd>
</div>
<div class="my-1 flex w-full justify-center gap-1">
  <kbd id="s" class="kbd">s</kbd>
  <kbd id="d" class="kbd">d</kbd>
  <kbd id="a" class="kbd">a</kbd>
  <kbd id="f" class="kbd">f</kbd>
  <kbd id="g" class="kbd">g</kbd>
  <kbd id="h" class="kbd">h</kbd>
  <kbd id="j" class="kbd">j</kbd>
  <kbd id="k" class="kbd">k</kbd>
  <kbd id="l" class="kbd">l</kbd>
</div>
<div class="my-1 flex w-full justify-center gap-1">
  <kbd id="x" class="kbd">x</kbd>
  <kbd id="z" class="kbd">z</kbd>
  <kbd id="c" class="kbd">c</kbd>
  <kbd id="v" class="kbd">v</kbd>
  <kbd id="b" class="kbd">b</kbd>
  <kbd id="n" class="kbd">n</kbd>
  <kbd id="m" class="kbd">m</kbd>
  <kbd id="/" class="kbd">/</kbd>
</div>
        </div>
      
    <div class="flex justify-between w-3/4">
        <button class="btn rounded-full bg-purple-300 text-white px-6">
           Life
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-[1.2em]"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" /></svg>
  <span id="life-scor">5</span>
  
</button>
<button class="btn rounded-full bg-blue-300 px-6 ">
  score
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-[1.2em]"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" /></svg>
  <span id="curite-scor">0</span>
</button>
    </div>
    </div>
    </section>
    <section id="scoor-swo" class="score flex justify-center items-center min-h-screen hidden">
      <div class="text-white text-center spacee-y-6 bg-[#ffffff33] p-5 rounded-lg ">
        <h1 class="text-8xl">
          <span id="final-schor" class="font-extrabold" >score:14</span>
        </h1>
        <button onclick="play()" class="btn">play agin</button>
        
        <p>practice will make you pro</p>
      </div>
    </section>
    
  </main>
  <script src="games.js"></script>
</body>
</html>
